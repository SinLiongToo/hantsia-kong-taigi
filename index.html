<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>番薯仔講台語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
:root{
  --night:#140d24;--ink:#f7ecd8;--muted:#b3a6c9;
  --lantern:#d93a2b;--lantern-deep:#8e2117;
  --gold:#f5b630;--gold-deep:#a8730e;
  --jade:#2fa58a;--jade-deep:#1b6b58;
  --panel:#21173a;--panel-2:#2c1f4a;--edge:#4a3870;
  --tile:#f7ecd8;--tile-ink:#2a1a12;--tile-edge:#c9b48e;
  --bad:#ff6b5b;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-roman:"Charis SIL","Gentium Plus","Noto Serif","Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);background-image:radial-gradient(1200px 600px at 50% -10%,#2a1b4d 0%,transparent 70%);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
p{margin:0;line-height:1.75}
.roman{font-family:var(--f-roman)}
.muted{color:var(--muted)}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 48px}

/* header */
.bar{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:16px}
.bar h2{font-size:22px;flex:1;min-width:0}
.back{width:44px;height:44px;border-radius:50%;border:2px solid var(--edge);background:var(--panel);cursor:pointer;font-size:20px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--edge);font-weight:900;font-size:15px;white-space:nowrap}
.hearts{color:var(--lantern);letter-spacing:2px}

/* buttons */
.btn{font:700 18px var(--f-display);padding:12px 22px;border-radius:12px;border:0;background:var(--lantern);color:#fff6e0;box-shadow:0 5px 0 var(--lantern-deep);cursor:pointer;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lantern-deep)}
.btn.gold{background:var(--gold);color:#3a1d00;box-shadow:0 5px 0 var(--gold-deep)}
.btn.jade{background:var(--jade);box-shadow:0 5px 0 var(--jade-deep)}
.btn.ghost{background:var(--panel-2);box-shadow:0 5px 0 #150e27;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card{background:var(--panel);border:2px solid var(--edge);border-radius:18px;padding:20px}

/* home */
.hero{display:flex;align-items:center;gap:20px;margin:16px 0 28px}
.hero svg{width:120px;height:120px;flex:none}
.hero h1{font-size:clamp(30px,7vw,46px);line-height:1.15}
.hero .roman{font-size:17px;color:var(--gold);margin-top:6px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.sent{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 8px}
.sent .tile{cursor:default}
.sent .tile.blank{background:transparent;border:2px dashed var(--gold);box-shadow:none;min-width:72px;min-height:58px;color:var(--gold)}
.sent .tile.filled{background:#c8f2e4;box-shadow:0 4px 0 var(--jade)}
.sent .end{font-family:var(--f-display);font-size:24px}
.mode{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-3px);border-color:var(--gold)}
.mode .ico{font-size:34px}
.mode h3{font-size:24px}
.mode .roman{color:var(--gold);font-size:15px}
.mode p{font-size:15px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 8px}
.settings{margin-top:20px;display:grid;gap:14px}
.seg{display:inline-flex;border:2px solid var(--edge);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#3a1d00}
.set-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.set-row>span{min-width:88px;color:var(--muted);font-size:15px}

/* lesson map */
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.node{cursor:pointer;text-align:left;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .12s,border-color .12s}
.node:hover{transform:translateY(-2px);border-color:var(--gold)}
.node .no{font-size:13px;color:var(--muted);letter-spacing:.1em}
.node h3{font-size:20px}
.node .roman{font-size:14px;color:var(--gold)}
.node .st{margin-top:auto;color:var(--gold);letter-spacing:2px}
.node .st .off{color:#4a3870}

/* lesson page */
.note{font-size:17px;line-height:1.85}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.voc{background:var(--panel-2);border-radius:12px;padding:12px 14px}
.voc b{font-family:var(--f-display);font-size:24px;display:block}
.voc .roman{color:var(--gold);font-size:17px}
.voc small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.exs{display:grid;gap:10px;margin-top:12px}
.ex{background:var(--panel-2);border-radius:12px;padding:12px 16px}
.ex .h{font-family:var(--f-display);font-size:21px}
.ex .roman{color:var(--gold);font-size:17px}
.ex .z{color:var(--muted);font-size:14px}
.sec{font-size:15px;letter-spacing:.12em;color:var(--muted);margin:24px 0 4px}

/* puzzle */
.prompt{font-size:15px;color:var(--muted)}
.meaning{font-family:var(--f-display);font-size:clamp(22px,5vw,30px);margin:4px 0 16px}
.answer{min-height:96px;border:2px dashed var(--edge);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;align-content:flex-start;transition:border-color .2s,background .2s}
.answer.ok{border-color:var(--jade);border-style:solid;background:rgba(47,165,138,.12)}
.answer.no{animation:shake .4s}
.answer .ph{color:var(--muted);font-size:15px;padding:0 4px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;min-height:72px;justify-content:center}
.tile{background:var(--tile);color:var(--tile-ink);border:0;border-radius:12px;box-shadow:0 4px 0 var(--tile-edge);padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;transition:transform .08s}
.tile.new{animation:pop .18s ease-out}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--tile-edge)}
.tile .h{font-family:var(--f-display);font-size:24px;line-height:1.2}
.tile .roman{font-size:15px;color:#7a4a1e}
.only-lo .tile .roman{font-size:20px;color:var(--tile-ink);font-weight:700}
.tile.bad{background:#ffd5cf;box-shadow:0 4px 0 var(--bad)}
.tile.ghost{visibility:hidden}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.result{margin-top:16px;padding:16px 18px;border-radius:14px;background:var(--panel-2);display:grid;gap:4px}
.result .h{font-family:var(--f-display);font-size:24px}
.result .roman{color:var(--gold);font-size:18px}
.result .src{font-size:13px;color:var(--muted)}
.verdict{font-family:var(--f-display);font-size:22px}
.verdict.ok{color:#5fdcb9}.verdict.no{color:var(--bad)}
.progress{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}

/* quiz choices */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:8px}
.choice{background:var(--panel-2);border:2px solid var(--edge);border-radius:14px;padding:14px;cursor:pointer;text-align:center;display:grid;gap:2px}
.choice b{font-family:var(--f-display);font-size:24px}
.choice .roman{color:var(--gold);font-size:17px}
.choice.right{border-color:var(--jade);background:rgba(47,165,138,.2)}
.choice.wrong{border-color:var(--bad);background:rgba(255,107,91,.15)}

/* maker */
.slots{display:grid;gap:14px}
.slot h3{font-size:16px;color:var(--muted);font-family:var(--f-body);font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--edge);background:var(--panel-2);border-radius:12px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:52px}
.chip .h{font-family:var(--f-display);font-size:19px}
.chip .roman{font-size:13px;color:var(--gold)}
.only-lo .chip .roman{font-size:16px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#3a1d00}
.chip[aria-pressed="true"] .roman{color:#3a1d00}
.pats{margin-bottom:12px}
.made{position:sticky;top:8px;z-index:2;margin-bottom:16px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.made .h{font-family:var(--f-display);font-size:clamp(24px,5.5vw,32px);line-height:1.35}
.made .roman{color:var(--gold);font-size:clamp(17px,4vw,21px)}
.made .z{color:var(--muted)}
.made .why{margin-top:8px;font-size:15px}
.spin .h,.spin .roman{animation:spin .25s}
@keyframes spin{from{transform:translateY(-10px);opacity:0}}
.book{display:grid;gap:8px;margin-top:10px}
.book div{background:var(--panel-2);border-radius:10px;padding:8px 12px;font-size:15px}
.book .roman{color:var(--gold)}

.big-done{text-align:center;display:grid;gap:14px;justify-items:center;padding:28px 20px}
.big-done svg{width:130px;height:130px}
.big-done .stars{font-size:42px;color:var(--gold);letter-spacing:6px}
.big-done .stars .off{color:#4a3870}
footer{margin-top:36px;font-size:13px;color:var(--muted);line-height:1.8}
footer a{color:var(--muted)}
.only-han .tile .roman,.only-han .chip .roman,.only-han .ex .roman,.only-han .result .roman,.only-han .made .roman{display:none}
.only-lo .tile .h,.only-lo .chip .h,.only-lo .ex .h,.only-lo .result .h,.only-lo .made .h{display:none}
/* 全羅：中文字體的聲調符號會跑位，UI 文字改用羅馬字字體 */
body.only-lo,.only-lo .btn,.only-lo h1,.only-lo h2,.only-lo h3,.only-lo .seg button,.only-lo .pill,.only-lo .meaning{font-family:var(--f-roman)}
@media (max-width:520px){
  .made{padding:12px 14px}.made .h{font-size:22px}.made .roman{font-size:16px}.made .why{font-size:14px;margin-top:4px}.made .btn{font-size:16px;padding:9px 14px}
  .hero{gap:12px}.hero svg{width:86px;height:86px}
  .tile{padding:6px 10px;min-width:44px}.tile .h{font-size:21px}.tile .roman{font-size:14px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<body>
<main class="wrap" id="main"></main>
<script src="data/sentences.js"></script>
<script>
'use strict';
const D=window.TG_DATA;
const $=s=>document.querySelector(s);
const main=$('#main');

/* ---------- save ---------- */
const SAVE={script:'both',rom:'tl',hua:true,muted:false,stars:{},best:{},book:[],solved:0,makerWins:0};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('tg-kuah-save')||'{}'))}catch(e){}
function persist(){try{localStorage.setItem('tg-kuah-save',JSON.stringify(SAVE))}catch(e){}}

/* ---------- romanization: Tâi-lô → Pe̍h-ōe-jī（佮番薯仔大冒險仝一套） ---------- */
const TONE='[\\u0300-\\u030F]';
function tl2poj(s){
  s=s.normalize('NFD')
    .replace(/Tsh/g,'Chh').replace(/tsh/g,'chh').replace(/Ts/g,'Ch').replace(/ts/g,'ch')
    .replace(new RegExp(`o(${TONE}?)o`,'g'),'o$1͘')
    .replace(new RegExp(`([uU])(\\]?)(${TONE}?)([ae])`,'g'),(m,u,b,t,v)=>(u==='U'?'O':'o')+b+t+v)
    .replace(new RegExp(`([oO])(\\]?)([ae])(${TONE})(?=\\]?(?:$|[-\\s]))`,'g'),'$1$4$2$3')
    .replace(/nn(?=\]?(?:$|[-\s]|h))/g,'ⁿ')
    .replace(new RegExp(`i(${TONE}?)(ng|k)`,'g'),'e$1$2');
  return s.normalize('NFC');
}
const R=s=>SAVE.rom==='poj'?tl2poj(s):s;
const isLo=()=>SAVE.script==='lo';
const X=(han,lo)=>isLo()?R(lo):han;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const HAN_END={'.':'。','?':'？','!':'！'};
const sentLo=(tiles,e)=>cap(tiles.map(t=>t[1]).join(' '))+e;
const sentHan=(tiles,e)=>tiles.map(t=>t[0]).join('')+HAN_END[e];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const starTxt=n=>'★'.repeat(n)+`<span class="off">${'★'.repeat(3-n)}</span>`;
function applyScript(){document.body.classList.toggle('only-han',SAVE.script==='han');document.body.classList.toggle('only-lo',SAVE.script==='lo');document.title=isLo()?R('Han-tsî-á Kóng Tâi-gí'):'番薯仔講台語'}

/* ---------- audio ---------- */
const A={ctx:null,master:null};
function ensureAudio(){
  if(!A.ctx){try{A.ctx=new(window.AudioContext||window.webkitAudioContext)();A.master=A.ctx.createGain();A.master.gain.value=SAVE.muted?0:.5;A.master.connect(A.ctx.destination)}catch(e){return}}
  if(A.ctx.state==='suspended')A.ctx.resume();
}
function tone(f,d,{type='square',vol=.1,slide=0,delay=0}={}){
  if(!A.ctx||SAVE.muted)return;const t0=A.ctx.currentTime+delay;
  const o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(A.master);o.start(t0);o.stop(t0+d+.03);
}
const SFX={
  tap:()=>tone(660,.05,{type:'triangle',vol:.12}),
  back:()=>tone(440,.05,{type:'triangle',vol:.1,slide:330}),
  right:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.16,{vol:.07,delay:i*.08})),
  wrong:()=>{tone(196,.18,{type:'sawtooth',vol:.06});tone(147,.28,{type:'sawtooth',vol:.06,delay:.16})},
  spin:()=>[0,1,2,3,4,5].forEach(i=>tone(400+i*90,.04,{type:'triangle',vol:.08,delay:i*.04})),
  win:()=>[523,659,784,659,784,1046].forEach((f,i)=>tone(f,.2,{vol:.07,delay:i*.13})),
};
document.addEventListener('pointerdown',ensureAudio,{once:true});

/* ---------- 番薯仔 mascot ---------- */
function mascot(mood='happy'){
  const mouth=mood==='sad'?'M44 76 Q60 66 76 76':mood==='wow'?'M52 70 Q60 82 68 70 Z':'M44 68 Q60 84 76 68';
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
  <path d="M60 20 C40 4 30 12 34 22 C24 14 18 22 26 30" fill="none" stroke="#3fae6a" stroke-width="7" stroke-linecap="round"/>
  <path d="M60 20 C70 2 86 6 82 20" fill="#3fae6a"/>
  <ellipse cx="60" cy="68" rx="40" ry="44" fill="#b2453d"/>
  <ellipse cx="60" cy="72" rx="34" ry="36" fill="#c9574a"/>
  <circle cx="34" cy="70" r="7" fill="#f08a7a" opacity=".55"/><circle cx="86" cy="70" r="7" fill="#f08a7a" opacity=".55"/>
  <circle cx="46" cy="56" r="6" fill="#2a1a12"/><circle cx="74" cy="56" r="6" fill="#2a1a12"/>
  <circle cx="48" cy="54" r="2" fill="#fff"/><circle cx="76" cy="54" r="2" fill="#fff"/>
  <path d="${mouth}" fill="${mood==='wow'?'#2a1a12':'none'}" stroke="#2a1a12" stroke-width="4" stroke-linecap="round"/>
  <path d="M38 96 l2 4 M76 94 l2 5 M58 104 l1 4" stroke="#7a2a24" stroke-width="3" stroke-linecap="round"/></svg>`;
}

/* ---------- 共用：頂懸彼條 ---------- */
function bar(title,right=''){return `<div class="bar"><button class="back" id="back" aria-label="${X('轉去','Tńg--khì')}">←</button><h2>${title}</h2>${right}</div>`}
function onBack(fn){$('#back').onclick=()=>{SFX.back();fn()}}

/* ---------- 首頁 ---------- */
const LESSON_LO={greet:'Sio-tsioh-mn̄g',lang:'Jîn-tshing',si:'Sī / m̄-sī',u:'Ū / bô',beh:'Beh',teh:'Teh',ah:'Kù-bué --ah',e:'Ē / bē',kam:'Kám mn̄g-kù',ka:'Kā',hoo:'Hōo',ti:'Tī',kah:'Kah',khah:'Khah',mng:'Mn̄g tāi-tsì',
  num:'Sòo-jī',ke:'Ka-jîn',si5:'Sî-kan',tsiah5:'Si̍t-bu̍t',tong:'Tōng-bu̍t',sin:'Sin-khu',hing:'Sik-tsuí kah hîng-iông',long:'Lóng',ma:'Mā',koh:'Koh',to:'Tō',tsiah:'Tsiah',bue:'Iáu-buē / buē',mai:'Mài / m̄-thang',kap:'Kah（佮）',e5:'Ê',liong:'Liōng-sû',thoo:'Thîng-tōo',tsuian:'Tsū-jiân',tiap:'Thia̍p-jī hîng-iông'};
const LESSONS=D.lessons;
function home(){
  const totStars=Object.values(SAVE.stars).reduce((a,b)=>a+b,0);
  main.innerHTML=`
  <div class="hero">${mascot()}<div><h1>${X('番薯仔講台語','Han-tsî-á Kóng Tâi-gí')}</h1>
    <div class="roman">${isLo()?'番薯仔講台語':R('Han-tsî-á Kóng Tâi-gí')}</div></div></div>
  <div class="modes">
    <button class="card mode" data-go="school"><span class="ico">📖</span><h3>${X('學堂','O̍h-tn̂g')}</h3><span class="roman">${R(isLo()?'學堂':'O̍h-tn̂g')}</span>
      <p>${X(`${LESSONS.length} 課基本台語：語法課（欲、咧、矣、敢、量詞…）佮詞彙課（數字、家人、食物…），逐課有說明、例句佮練習。`,`${LESSONS.length} khò ki-pún Tâi-gí.`)}</p></button>
    <button class="card mode" data-go="arrange"><span class="ico">🧩</span><h3>${X('排句仔','Pâi kù-á')}</h3><span class="roman">${R(isLo()?'排句仔':'Pâi kù-á')}</span>
      <p>${X(`看華語意思，共詞卡排做台語句。${D.sents.length} 句攏是辭典的例句。`,`${D.sents.length} kù sû-tián ê lē-kù.`)}</p></button>
    <button class="card mode" data-go="fill"><span class="ico">✏️</span><h3>${X('填空','Thiām-khang')}</h3><span class="roman">${R(isLo()?'填空':'Thiām-khang')}</span>
      <p>${X('辭典例句挖一个空，揀著正確的詞。一輪 10 題，課課攏有。','Lē-kù thiām-khang, tsi̍t lûn 10 tê.')}</p></button>
    <button class="card mode" data-go="maker"><span class="ico">🎰</span><h3>${X('造句機','Tsō-kù-ki')}</h3><span class="roman">${R(isLo()?'造句機':'Tsō-kù-ki')}</span>
      <p>${X('家己揀主語、時間、動作，組出台語句；番薯仔共你講自然無。','Ka-kī kíng sû, tsoo kù-á.')}</p></button>
  </div>
  <div class="stats">
    <span class="pill">⭐ ${totStars} / ${LESSONS.length*3}</span>
    <span class="pill">🧩 ${X('排好','Pâi hó')} ${SAVE.solved}</span>
    <span class="pill">📒 ${X('句仔簿','Kù-á-phōo')} ${SAVE.book.length}</span>
  </div>
  <div class="card settings">

function vocabQuiz(L,award){

      <div class="choices">${opts.map((o,k)=>`<button class="choice" data-k="${k}">${dir?`<b>${esc(o[2])}</b>`:`${isLo()?'':`<b>${esc(o[0])}</b>`}<span class="roman">${esc(R(o[1]))}</span>`}</button>`).join('')}</div></div>`;
    onBack(()=>lesson(L));

    main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(answered)return;const o=opts[+b.dataset.k];
      if(o===it){answered=true;b.classList.add('right');SFX.right();i++;setTimeout(step,700)}

const lowP=s=>s.toLowerCase().replace(/[.,?!]/g,'');
function fillQuiz({title,lessons,n,back,onEnd}){
  const allBlanks=D.lessons.flatMap(L=>(L.blank||[]).map(b=>({b,L})));
  const cands=[];
  for(const L of lessons)for(const si of L.s){
    const s=D.sents[si],k=s.t.findIndex(([h,l])=>L.blank.some(([bh,bl])=>bh===h&&bl===lowP(l)));
    if(k>=0)cands.push({s,k,L});
  }
  const qs=shuffle(cands).slice(0,n);let i=0,mist=0;
  const step=()=>{
    if(i>=qs.length){onEnd(mist<=1?3:mist<=3?2:1);return}
    const {s,k,L}=qs[i],ans=[s.t[k][0],lowP(s.t[k][1])];
    const src=L.blankSame?L.blank.map(b=>({b,L})):allBlanks.filter(x=>x.L!==L);
    const seen=new Set([ans[0],ans[1]]),opts=[ans];
    for(const {b} of shuffle(src)){if(opts.length>=4)break;if(seen.has(b[0])||seen.has(b[1]))continue;seen.add(b[0]);seen.add(b[1]);opts.push(b)}
    const order=shuffle(opts);
    const sentHTML=(fill)=>s.t.map((t,j)=>j===k
      ?(fill?`<span class="tile filled"><span class="h">${esc(t[0])}</span><span class="roman">${esc(R(t[1]))}</span></span>`:'<span class="tile blank"><span class="h">？</span></span>')
      :`<span class="tile"><span class="h">${esc(t[0])}</span><span class="roman">${esc(R(t[1]))}</span></span>`).join('')+`<span class="end">${HAN_END[s.e]}</span>`;
    main.innerHTML=bar(title,`<span class="pill">${i+1} / ${qs.length}</span>`)+
      `<div class="progress"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="card"><div class="prompt">${X('空格內底愛囥啥物詞？','Khang-keh lāi-té ài khǹg siánn-mih sû?')}</div>
      <div class="meaning">${esc(s.z)}</div>
      <div class="sent" id="sent">${sentHTML(false)}</div>
      <div class="choices">${order.map((o,j)=>`<button class="choice" data-j="${j}">${isLo()?'':`<b>${esc(o[0])}</b>`}<span class="roman">${esc(R(o[1]))}</span></button>`).join('')}</div>
      <div id="res"></div></div>`;
    onBack(back);
    let answered=false;
    main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(answered)return;const o=order[+b.dataset.j];
      if(o===ans){answered=true;b.classList.add('right');SFX.right();$('#sent').innerHTML=sentHTML(true);
        $('#res').innerHTML=`<div class="result"><div class="h">${esc(sentHan(s.t,s.e))}</div><div class="roman">${esc(R(sentLo(s.t,s.e)))}</div>
          <div class="src">${X('辭典詞條','Sû-tián sû-tiâu')}：${esc(s.w)}${lessons.length>1?' · '+X('課','Khò')+'：'+esc(isLo()?R(LESSON_LO[L.id]):L.title):''}</div>
          <div class="row" style="margin-top:10px"><button class="btn gold" id="nx">${X('下一題','Ē tsi̍t tê')} →</button></div></div>`;
        $('#nx').onclick=()=>{SFX.tap();i++;step()};$('#nx').focus({preventScroll:true})}
      else{b.classList.add('wrong');b.disabled=true;mist++;SFX.wrong()}
    });
    window.scrollTo(0,0);
  };step();
}

/* ---------- 排句仔：一題 ---------- */
// 易混的詞：揀一个做「陷阱詞卡」
const CONFUSE=[['無','bô','毋','m̄'],['有','ū','是','sī'],['欲','beh','愛','ài'],['咧','teh','佇','tī'],['共','kā','予','hōo'],['會','ē','袂','bē']];
const low=s=>s.toLowerCase();
function distractors(s,n){
  const out=[],used=new Set(s.t.map(t=>low(t[1])));
  for(const [h1,l1,h2,l2] of shuffle(CONFUSE)){
    if(out.length>=n)break;
    if(s.t.some(t=>t[0]===h1)&&!used.has(l2)){out.push([h2,l2]);used.add(l2)}
    else if(s.t.some(t=>t[0]===h2)&&!used.has(l1)){out.push([h1,l1]);used.add(l1)}
  }
  let guard=0;
  while(out.length<n&&guard++<50){const o=pick(D.sents);const t=pick(o.t);const l=low(t[1]);if(!used.has(l)){out.push([t[0],l]);used.add(l)}}
  return out;
}
function tileHTML(t,id,cls=''){return `<button class="tile ${cls}" data-id="${id}"><span class="h">${esc(t[0])}</span><span class="roman">${esc(R(t[1]))}</span></button>`}
function puzzle(box,s,{distract=0,onSolved,onMistake,onHint}){
  const tiles=s.t.map(t=>[t[0],t[1]]).concat(distractors(s,distract));
  let order=shuffle(tiles.map((_,i)=>i));
  for(let g=0;g<5&&order.slice(0,s.t.length).every((v,i)=>v===i);g++)order=shuffle(order);
  const ans=[];let tries=0,solved=false;
  const target=s.t.map(t=>low(t[1]));
  box.innerHTML=`<div class="card"><div class="prompt">${X('共這句排做台語：','Kā tsit kù pâi tsò Tâi-gí:')}</div>
    <div class="meaning">${SAVE.hua?esc(s.z):`<span class="muted">${X('（華語提示關起來矣）','(Huâ-gí thê-sī kuainn--khí-lâi--ah)')}</span>`}</div>
    <div class="answer" id="ans"></div><div class="bank" id="bank"></div>
    <div class="row"><button class="btn jade" id="chk" disabled>${X('檢查','Kiám-tsa')}</button>
    <button class="btn ghost" id="hint">💡 ${X('提示','Thê-sī')}</button><button class="btn ghost" id="clr">${X('清掉','Tshing--tiāu')}</button>
    <span class="muted" id="cnt" style="margin-left:auto"></span></div><div id="res"></div></div>`;
  const ansEl=box.querySelector('#ans'),bankEl=box.querySelector('#bank'),chk=box.querySelector('#chk');
  let last=-1;
  function draw(bad=[]){
    ansEl.innerHTML=ans.length?ans.map((id,k)=>tileHTML(tiles[id],id,(bad.includes(k)?'bad ':'')+(id===last?'new':''))).join(''):`<span class="ph">${X('點下底的詞卡，排佇遮','Tiám ē-kha ê sû-khah, pâi tī tsia')}</span>`;
    bankEl.innerHTML=order.map(id=>tileHTML(tiles[id],id,ans.includes(id)?'ghost':'')).join('');
    chk.disabled=ans.length!==s.t.length||solved;
    box.querySelector('#cnt').textContent=`${ans.length} / ${s.t.length}`;
  }
  bankEl.onclick=e=>{const b=e.target.closest('.tile');if(!b||solved)return;const id=+b.dataset.id;if(ans.includes(id))return;
    if(ans.length>=s.t.length){ansEl.classList.remove('no');void ansEl.offsetWidth;ansEl.classList.add('no');return}
    ans.push(id);last=id;SFX.tap();draw();last=-1};
  ansEl.onclick=e=>{const b=e.target.closest('.tile');if(!b||solved)return;ans.splice(ans.indexOf(+b.dataset.id),1);SFX.back();draw()};
  box.querySelector('#clr').onclick=()=>{if(solved)return;ans.length=0;SFX.back();draw()};
  box.querySelector('#hint').onclick=()=>{
    if(solved)return;
    let k=0;while(k<ans.length&&low(tiles[ans[k]][1])===target[k])k++;
    ans.length=k;
    if(k<target.length){const id=order.find(id=>!ans.includes(id)&&low(tiles[id][1])===target[k]);ans.push(id)}
    SFX.tap();onHint&&onHint();draw();
  };
  chk.onclick=check;
  function check(){
    if(chk.disabled)return;
    const got=ans.map(id=>low(tiles[id][1]));
    if(got.every((v,i)=>v===target[i])){solved=true;ansEl.classList.add('ok');SFX.right();finish(true);return}
    tries++;SFX.wrong();onMistake&&onMistake();
    ansEl.classList.remove('no');void ansEl.offsetWidth;ansEl.classList.add('no');
    draw(got.map((v,i)=>v!==target[i]?i:-1).filter(i=>i>=0));
    if(tries>=2){solved=true;finish(false)}
  }
  function finish(ok){
    chk.disabled=true;
    box.querySelector('#res').innerHTML=`<div class="result"><div class="verdict ${ok?'ok':'no'}">${ok?X('著矣！','Tio̍h--ah!'):X('正確答案是：','Tsìng-khak tap-àn sī:')}</div>
      <div class="h">${esc(sentHan(s.t,s.e))}</div><div class="roman">${esc(R(sentLo(s.t,s.e)))}</div>
      <div class="z muted">${esc(s.z)}</div><div class="src">${X('辭典詞條','Sû-tián sû-tiâu')}：${esc(s.w)}</div>
      <div class="row" style="margin-top:10px"><button class="btn gold" id="nx">${X('下一題','Ē tsi̍t tê')} →</button></div></div>`;
    box.querySelector('#nx').onclick=()=>{SFX.tap();onSolved(ok)};
    box.querySelector('#nx').focus({preventScroll:true});
  }
  box._key=e=>{
    if(e.key==='Enter'){const nx=box.querySelector('#nx');if(nx)nx.click();else check();e.preventDefault()}
    else if(e.key==='Backspace'&&!solved&&ans.length){ans.pop();SFX.back();draw();e.preventDefault()}
  };
  draw();
}
document.addEventListener('keydown',e=>{const b=$('#pz');if(b&&b._key&&!e.target.closest('input'))b._key(e)});

/* 學堂練習：固定題數 */
function runRounds({title,qs,distract,onBack:ob,onEnd}){
  let i=0,mist=0;
  const step=()=>{
    if(i>=qs.length){onEnd(mist);return}
    main.innerHTML=bar(title,`<span class="pill">${i+1} / ${qs.length}</span>`)+`<div class="progress"><i style="width:${i/qs.length*100}%"></i></div><div id="pz"></div>`;
    onBack(ob);
    puzzle($('#pz'),qs[i],{distract,onMistake:()=>mist++,onHint:()=>mist++,onSolved:ok=>{if(ok)SAVE.solved++;persist();i++;step()}});
    window.scrollTo(0,0);
  };step();
}

const LV=[[1,'初級','Tshoo-kip','3～5 張詞卡，上捷用的詞'],[2,'中級','Tiong-kip','加一張陷阱詞卡'],[3,'高級','Ko-kip','句較長，兩張陷阱詞卡']];

function arrangeRun(lv){
  const pool=shuffle(D.sents.filter(s=>s.lv===lv));
  let i=0,lives=3,score=0,combo=0,count=0;
  const name=X(LV[lv-1][1],LV[lv-1][2]);
  const step=()=>{
    if(lives<=0){
      const best=Math.max(SAVE.best[lv]||0,score),isNew=score>(SAVE.best[lv]||0);SAVE.best[lv]=best;persist();SFX.win();
      main.innerHTML=`<div class="card big-done">${mascot(score?'happy':'sad')}<h2>${X('結束矣','Kiat-sok--ah')}</h2>
        <p style="font-size:20px">${X('排好','Pâi hó')} ${count} ${X('句','kù')} · ${score} ${X('分','hun')}${isNew?' 🏆 '+X('新紀錄！','Sin kì-lo̍k!'):''}</p>
        <div class="row" style="justify-content:center"><button class="btn ghost" id="m">${X('換等級','Uānn tíng-kip')}</button><button class="btn gold" id="a">${X('閣來','Koh lâi')} →</button></div></div>`;
      $('#m').onclick=()=>{SFX.tap();arrangeMenu()};$('#a').onclick=()=>{SFX.tap();arrangeRun(lv)};return;
    }
    const s=pool[i++%pool.length];let hints=0,missed=false;
    main.innerHTML=bar(name,`<span class="pill hearts">${'♥'.repeat(lives)}<span style="color:#4a3870">${'♥'.repeat(3-lives)}</span></span><span class="pill">${score}${combo>1?' · 🔥'+combo:''}</span>`)+`<div id="pz"></div>`;
    onBack(arrangeMenu);
    puzzle($('#pz'),s,{distract:lv-1,onHint:()=>hints++,onMistake:()=>{},onSolved:ok=>{
      if(ok){count++;SAVE.solved++;combo++;score+=Math.max(2,10+lv*5+combo*2-hints*5)}else{lives--;combo=0}
      persist();step()}});
    window.scrollTo(0,0);
  };step();
}

/* ---------- 造句機 ---------- */
// 詞攏對辭典查證；組合規則（自然無）是 AI 整理的教學判斷，毋是官方資料
const M=D.maker,W=M.W;
const ENDS=[['。','.'],['矣','--ah'],['無？','--bô?']];
const END_OUT=[['。','.','。'],['矣。','--ah.','了。'],['無？','--bô?','嗎？']];
const pr=(h,l)=>[h,l];
// 共詞卡組做一句：tiles＝[[漢,羅]…]，end＝[漢尾,羅尾,華尾]
function fin(tiles,end,hz,why){
  return {han:tiles.map(t=>t[0]).join('')+end[0],lo:cap(tiles.map(t=>t[1]).join(' '))+end[1],hz:hz+end[2],why};
}
const TYPE_Z={p:'人',a:'動物',f:'食物',w:'天氣、日子',l:'所在'};
const nsHan=N=>N[0].map(t=>t[0]).join('');
function adjWhy(N,J){
  const ty=N[2];if(J[3].includes(ty))return '';
  if(J[0]==='熱'&&ty==='f')return '食物燒燙燙，台語講「燒」；「熱」是講天氣佮所在。';
  if(J[0]==='寒'&&ty==='f')return '食物冷去，台語講「冷」；「寒」是講天氣佮所在。';
  if((J[0]==='燒'||J[0]==='冷')&&ty==='w')return '天氣講「熱」「寒」；「燒」「冷」是講食物、物件。';
  return `「${nsHan(N)}」配「${J[0]}」怪怪：「${J[0]}」是用來講${[...J[3]].map(k=>TYPE_Z[k]).join('、')}的。`;
}

/* 句型一：動作句 */
function judgeAct(S,T,D,A,L,V,e){
  const a=A?A[0]:'',t=T?T[3]:'',d=D?D[0]:'',vz=V[2],vh=V[0][0]+(V[1]?V[1][0]:'');
  if(e==='無？'&&['無','毋','袂'].includes(a))return '句尾「無？」已經是問句，頭前閣用否定詞，聽起來怪怪。想欲問，會使改用「敢」。';
  if(t==='fut'&&['有','咧','捌'].includes(a))return `「明仔載」是後日仔的代誌，「${a}」講的是已經抑是當咧發生。試看「欲」抑是「會」。`;
  if(t==='fut'&&e==='矣'&&!['欲','會','袂','毋'].includes(a))return '「明仔載」閣未到，「矣」是講已經發生，莫做伙用。前面加「欲」就順矣。';
  if(t==='past'&&a==='會')return `「${T[0]}」已經過去矣，「會」較濟講未來的代誌。試看「有」抑是「無」。`;
  if(t==='past'&&a==='捌')return `「捌」是講「以前有這款經驗」，毋是講「${T[0]}」這一擺。試看「有」。`;
  if(T&&T[0]==='昨昏'&&a==='咧')return '「咧」是講這馬當咧做。講昨昏的代誌，用「有」較自然。';
  if(t==='hab'&&a==='咧')return '「逐工」是講習慣，毋免加「咧」。直接講「逐工＋動作」就好。';
  if(t==='hab'&&e==='矣')return '「逐工」是習慣，「矣」是講一擺的改變，兩个鬥起來怪怪。';
  if(a==='捌'&&(t==='hab'||t==='now'||t==='fut'))return '「捌」是講「以前有這款經驗」，佮「'+T[0]+'」鬥起來怪怪。';
  if((a==='捌'||a==='有')&&e==='矣')return `「${a}」本身就有「已經發生」的意思，句尾閣加「矣」傷重複。`;
  if((d==='閣'||d==='猶閣')&&a==='捌')return `「${d}」佮「捌」較袂做伙用。想欲講「又一擺」，會使用「閣有」。`;
  if(d==='猶閣'&&e==='矣')return '「猶閣」是講猶咧繼續，「矣」是講已經改變，兩个相拄頭。';
  if(L&&V[3]==='go')return `「${V[0][0]}」本身就有方向矣，閣加「佇${L[0]}」怪怪。想欲講去佗位，直接揀「去…」就好。`;
  if(L&&L[3]==='in'&&V[3]==='out')return `佇${L[0]}${vh}？空間無夠啦！換一个所在。`;
  if(L&&L[3]==='out'&&V[3]==='bed')return `佇${L[0]}${vh}？較奇怪喔，這通常是佇厝內做的代誌。`;
  if(e==='無？'&&(S[0]==='我'||S[0]==='阮'))return '家己問家己？問人的時，主語通常用「你」抑是「恁」。';
  if(S[0]==='囡仔'&&vz==='開車'&&!['袂','毋','無'].includes(a))return '囡仔袂使開車喔！換一个動作，抑是用「袂」。';
  return '';
}
function buildAct(c){
  const S=M.S[c.S],T=c.T>=0?M.T[c.T]:null,Dv=c.D>=0?M.ADV[c.D]:null,A=c.A>=0?M.A[c.A]:null,L=c.L>=0?M.LOC[c.L]:null,V=M.V[c.V],[v,o,vz]=V;
  const loc=L?[W.ti,pr(L[0],L[1])]:[],teh=A&&A[0]==='咧';
  const tiles=[pr(S[0],S[1])];
  if(T)tiles.push(pr(T[0],T[1]));if(Dv)tiles.push(pr(Dv[0],Dv[1]));
  if(teh){tiles.push(...loc,pr(A[0],A[1]))}else{if(A)tiles.push(pr(A[0],A[1]));tiles.push(...loc)}  // 「佇厝咧食飯」：地點囥「咧」頭前
  tiles.push(pr(v[0],v[1]));if(o)tiles.push(pr(o[0],o[1]));
  const dz=Dv?Dv[2]:'',lz=L?'在'+L[2]:'';
  const hz=S[2]+(T?T[2]:'')+dz+(teh&&L?lz+'正在':(A?A[2]:'')+lz)+vz;
  return fin(tiles,END_OUT[c.E],hz,judgeAct(S,T,Dv,A,L,V,ENDS[c.E][0]));
}

/* 句型二：形容句（形容詞＝一般 ADJ ＋ ABB 疊字） */
const ADJS=[...M.ADJ,...M.ABB.map(x=>[...x,null,'abb'])];
const isMono=J=>!J[1].includes('-')&&!J[1].includes(' ');
// 疊字：Y＝1 兩擺（紅紅／歡歡喜喜），Y＝2 三擺（紅紅紅）。AA、AAA 是照規則組的；AABB 干焦用辭典有收的
const NO_REDUP=['好'];   // 「好好」「好好好」意思無仝（好好仔、好啦好啦），毋提來疊
function redup(J,y){
  if(!y)return {t:pr(J[0],J[1]),z:J[2]};
  if(NO_REDUP.includes(J[0]))return null;
  if(y===1&&isMono(J))return {t:pr(J[0]+J[0],J[1]+'-'+J[1]),z:J[4]||(J[2].length===1?J[2]+J[2]+'的':[...J[2]].map(ch=>ch+ch).join('')+'的')};
  if(y===1&&M.AABB[J[0]]){const a=M.AABB[J[0]];return {t:pr(a[0],a[1]),z:a[2]}}
  if(y===2&&isMono(J))return {t:pr(J[0]+J[0]+J[0],J[1]+'-'+J[1]+'-'+J[1]),z:J[2].length===1?'好'+J[2]+'好'+J[2]:'非常非常'+J[2]};
  return null;
}
function buildAdj(c){
  const N=M.NS[c.N],G=c.G>=0?M.DEG[c.G]:null,J=ADJS[c.J],y=c.Y>0?c.Y:0,e=ENDS[c.E][0],abb=J[5]==='abb';
  const rd=abb?{t:pr(J[0],J[1]),z:J[2]}:redup(J,y)||{t:pr(J[0],J[1]),z:J[2]};
  const tiles=[...N[0]];if(G)tiles.push(pr(G[0],G[1]));tiles.push(rd.t);
  const tight=abb||y;   // 疊字：本身就有程度
  let why='';
  if(abb&&y)why=`「${J[0]}」已經是疊字矣，袂當閣疊。`;
  else if(!abb&&y&&!redup(J,y))why=y===2?`疊三擺干焦用佇一字的形容詞，像「紅紅紅」「媠媠媠」；「${J[0]}」較無按呢講。`:`「${J[0]}」較少疊字。換一字的形容詞來疊，像「紅紅」「懸懸」。`;
  if(!why)why=adjWhy(N,J);
  if(!why&&tight&&G)why=`疊字本身就有「真」的意思，頭前毋免閣加「${G[0]}」。講「${nsHan(N)}${rd.t[0]}」就好。`;
  if(!why&&tight&&e==='無？')why='疊字是咧描寫樣相，較少用來問人。想欲問，用一般的形容詞：「…真媠無？」';
  if(!why&&tight&&e==='矣')why='疊字是咧描寫樣相，較少配「矣」。';
  if(!why&&!G&&!tight&&e==='。')why=`形容詞頭前通常愛加「真」「誠」這款詞，抑是疊字（${isMono(J)?J[0]+J[0]:'像「紅紅」'}）。干焦講「${nsHan(N)}${J[0]}」，聽起來話猶未講煞。`;
  if(!why&&G&&G[0]==='無'&&e==='無？')why='句尾「無？」已經是問句，頭前閣用「無」，聽起來怪怪。';
  if(!why&&G&&['真','誠','足','有夠'].includes(G[0])&&e==='矣')why=`「${G[0]}」是講這馬的狀態，「矣」是講有變化，兩个做伙較少按呢講。想欲講變化，會使講「${nsHan(N)}${J[0]}矣」抑是「${nsHan(N)}較${J[0]}矣」。`;
  if(!why&&e==='無？'&&N[0][0][0]==='我')why='家己問家己？問人的時，主語通常用「你」。';
  return fin(tiles,END_OUT[c.E],N[1]+(G?G[2]:'')+rd.z,why);
}

/* 句型三：比較句 */
const REL=[['比…較','pí … khah'],['佮…平','kah … pênn']];
const QS=[['。','.'],['敢…？','kám …?']];
function buildCmp(c){
  const A=M.NS[c.N],B=M.NS[c.B],J=M.ADJ[c.J];
  const tiles=[...A[0]];if(c.Q)tiles.push(W.kam);
  if(c.R===0)tiles.push(W.pi,...B[0],W.khah,pr(J[0],J[1]));else tiles.push(W.kah,...B[0],W.penn,pr(J[0],J[1]));
  const hz=A[1]+(c.R===0?'比'+B[1]+J[2]:'跟'+B[1]+'一樣'+J[2]);
  let why='';
  if(c.N===c.B)why='家己佮家己比？換一个來比。';
  else if(A[3]!==B[3])why=`「${nsHan(A)}」佮「${nsHan(B)}」無仝款，欲按怎比？揀仝一類的來比。`;
  else if(nsHan(A)==='天氣'||nsHan(B)==='天氣')why='「天氣」愛講佗一工，像「今仔日比昨昏較熱」。';
  else why=adjWhy(A,J)||adjWhy(B,J);
  if(!why&&c.Q&&A[0][0][0]==='我')why='家己問家己？問人的時，主語通常用「你」。';
  return fin(tiles,c.Q?['？','?','嗎？']:['。','.','。'],hz,why);
}

const PAT={
  act:{h:'動作句',l:'Tōng-tsok kù',build:buildAct,def:()=>({S:0,T:-1,D:-1,A:-1,L:-1,V:0,E:0}),slots:[
    {k:'S',h:'主語',l:'Tsú-gí',list:M.S},
    {k:'T',h:'時間',l:'Sî-kan',opt:1,list:M.T},
    {k:'D',h:'嘛／攏／閣',l:'Mā / lóng / koh',opt:1,list:M.ADV},
    {k:'A',h:'欲／咧／有…',l:'Beh / teh / ū…',opt:1,list:M.A},
    {k:'L',h:'地點',l:'Tē-tiám',opt:1,list:M.LOC.map(x=>['佇'+x[0],'tī '+x[1]])},
    {k:'V',h:'動作',l:'Tōng-tsok',list:M.V.map(([v,o])=>[v[0]+(o?o[0]:''),v[1]+(o?' '+o[1]:'')])},
    {k:'E',h:'句尾',l:'Kù-bué',list:ENDS}]},
  adj:{h:'形容句',l:'Hîng-iông kù',build:buildAdj,def:()=>({N:2,G:0,J:3,Y:-1,E:0}),slots:[
    {k:'N',h:'主語',l:'Tsú-gí',list:M.NS.map(n=>[nsHan(n),n[0].map(t=>t[1]).join(' ')])},
    {k:'G',h:'程度',l:'Thîng-tōo',opt:1,list:M.DEG},
    {k:'J',h:'形容',l:'Hîng-iông',list:M.ADJ},
    {k:'J',h:'疊字形容（ABB）',l:'Thia̍p-jī hîng-iông (ABB)',list:M.ABB,off:M.ADJ.length},
    {k:'Y',h:'疊字',l:'Thia̍p-jī',opt:1,list:[['疊兩擺','thia̍p nn̄g pái'],['疊三擺','thia̍p sann pái']],idx:1},
    {k:'E',h:'句尾',l:'Kù-bué',list:ENDS}]},
  cmp:{h:'比較句',l:'Pí-kàu kù',build:buildCmp,def:()=>({N:0,R:0,B:2,J:5,Q:0}),slots:[
    {k:'N',h:'主語',l:'Tsú-gí',list:M.NS.map(n=>[nsHan(n),n[0].map(t=>t[1]).join(' ')])},
    {k:'R',h:'比法',l:'Pí-huat',list:REL},
    {k:'B',h:'佮啥比',l:'Kah siánn pí',list:M.NS.map(n=>[nsHan(n),n[0].map(t=>t[1]).join(' ')])},
    {k:'J',h:'形容',l:'Hîng-iông',list:M.ADJ},
    {k:'Q',h:'講抑是問',l:'Kóng iah-sī mn̄g',list:QS}]},
};
// 仝一个 key 會使分做幾欄（像一般形容詞佮 ABB），值＝欄的 base＋序號
const slotBase=s=>s.off||s.idx||0;
function randomC(P){
  const K={};for(const s of P.slots){const k=K[s.k]||(K[s.k]={n:0,base:s.idx||0,opt:s.opt});k.n+=s.list.length}
  const c={};for(const k in K)c[k]=K[k].opt&&Math.random()<.35?-1:K[k].base+(Math.random()*K[k].n|0);return c;
}
function randomNatural(P){
  for(let g=0;g<3000;g++){
    const c=randomC(P);
    if(!P.build(c).why)return c;
  }
  return P.def();
}
function maker(pat='act',mode='free'){
  const P=PAT[pat];
  let c=P.def(),target=null,round=0,wins=0,tries=0;
  if(mode==='quiz')target=randomNatural(P);
  const render=(spin=false)=>{
    const b=P.build(c),inBook=SAVE.book.some(x=>x.han===b.han);
    const head=mode==='quiz'
      ?`<div class="prompt">${X('用造句機講出這句：','Iōng tsō-kù-ki kóng tshut tsit kù:')}</div><div class="meaning">${esc(P.build(target).hz)}</div>`:'';
    main.innerHTML=bar(X('造句機','Tsō-kù-ki'),`<div class="seg" id="mode"><button data-m="free" aria-pressed="${mode==='free'}">${X('自由造句','Tsū-iû')}</button><button data-m="quiz" aria-pressed="${mode==='quiz'}">${X('挑戰','Thiáu-tsiàn')}</button></div>`)+
    `<div class="seg pats" id="pats">${Object.entries(PAT).map(([id,p])=>`<button data-p="${id}" aria-pressed="${id===pat}">${X(p.h,p.l)}</button>`).join('')}</div>
    <div class="card made${spin?' spin':''}">${head}<div class="h">${esc(b.han)}</div><div class="roman">${esc(R(b.lo))}</div>
      ${mode==='free'?`<div class="z">${esc(b.hz)}</div><div class="why">${b.why?`<span class="verdict no" style="font-size:17px">🤔 ${esc(b.why)}</span>`:`<span class="verdict ok" style="font-size:17px">✅ ${X('真自然的台語句！','Tsin tsū-jiân ê Tâi-gí kù!')}</span>`}</div>`:'<div class="why" id="qres"></div>'}
      <div class="row" style="margin-top:12px">
      ${mode==='free'?`<button class="btn ghost" id="rnd">🎲 ${X('隨意組','Suî-ì tsoo')}</button><button class="btn gold" id="save" ${b.why||inBook?'disabled':''}>📒 ${inBook?X('簿仔有矣','Phōo-á ū--ah'):X('收入句仔簿','Siu ji̍p kù-á-phōo')}</button>`
        :`<button class="btn jade" id="qchk">${X('檢查','Kiám-tsa')}</button><span class="pill">${round+1} / 8 · ✅ ${wins}</span>`}</div></div>
    <div class="slots">${P.slots.map(s=>`<div class="slot"><h3>${X(s.h,s.l)}</h3><div class="chips" data-k="${s.k}">
        ${s.opt?`<button class="chip" data-i="-1" aria-pressed="${c[s.k]===-1}"><span class="h">—</span><span class="roman">${X('免','bián')}</span></button>`:''}
        ${s.list.map((w,i)=>`<button class="chip" data-i="${i+slotBase(s)}" aria-pressed="${c[s.k]===i+slotBase(s)}"><span class="h">${esc(w[0])}</span><span class="roman">${esc(R(w[1]))}</span></button>`).join('')}</div></div>`).join('')}</div>
    ${mode==='free'&&SAVE.book.length?`<div class="sec">${X('我的句仔簿','GUÁ Ê KÙ-Á-PHŌO')}（${SAVE.book.length}）</div><div class="book">${SAVE.book.slice(-12).reverse().map(x=>`<div>${isLo()?'':esc(x.han)+'　'}<span class="roman">${esc(R(x.lo))}</span></div>`).join('')}</div>`:''}
    <footer>${X('造句機的詞攏有對教育部辭典查證；「自然無」的判斷是 AI 整理的教學規則，毋是官方資料，實際講話有時較活。','Sû lóng ū tuì sû-tián tshâ-tsìng.')}</footer>`;
    onBack(home);
    main.querySelectorAll('#mode button').forEach(x=>x.onclick=()=>{SFX.tap();maker(pat,x.dataset.m)});
    main.querySelectorAll('#pats button').forEach(x=>x.onclick=()=>{SFX.tap();maker(x.dataset.p,mode)});
    main.querySelectorAll('.chips').forEach(g=>g.onclick=e=>{const x=e.target.closest('.chip');if(!x)return;c[g.dataset.k]=+x.dataset.i;SFX.tap();keep(render)});
    if(mode==='free'){
      $('#rnd').onclick=()=>{c=randomNatural(P);SFX.spin();keep(()=>render(true))};
      $('#save').onclick=()=>{SAVE.book.push({han:b.han,lo:b.lo});persist();SFX.right();keep(render)};
    }else{
      $('#qchk').onclick=()=>{
        const t=P.build(target),ok=P.build(c).han===t.han,r=$('#qres');
        if(ok){wins+=tries===0?1:0;SFX.right();r.innerHTML=`<span class="verdict ok">✅ ${X('著矣！','Tio̍h--ah!')}</span>`}
        else{tries++;SFX.wrong();
          if(tries<2){r.innerHTML=`<span class="verdict no">❌ ${X('猶未著，閣試一擺','Iáu-buē tio̍h, koh tshì tsi̍t pái')}</span>`;return}
          r.innerHTML=`<span class="verdict no">${X('答案','Tap-àn')}：</span> ${isLo()?'':esc(t.han)} <span class="roman" style="color:var(--gold)">${esc(R(t.lo))}</span>`}
        $('#qchk').disabled=true;
        setTimeout(()=>{round++;tries=0;
          if(round>=8){const st=wins>=7?3:wins>=5?2:1;SAVE.makerWins=Math.max(SAVE.makerWins||0,wins);persist();done(st,()=>maker(pat,'quiz'),()=>maker(pat,'free'));return}
          target=randomNatural(P);c=P.def();render();window.scrollTo(0,0)},ok?900:2200);
      };
    }
  };
  // 重畫的時保持捲動位置
  const keep=fn=>{const y=window.scrollY;fn();window.scrollTo(0,y)};
  render();window.scrollTo(0,0);
}

applyScript();home();
</script>
